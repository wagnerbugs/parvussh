[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "parvussh"
version = "0.1.0"
description = "Manage ~/.ssh/config without hiding ~/.ssh/config"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "wagnerbugs" }]
keywords = ["ssh", "ssh-config", "gtk4", "libadwaita", "gnome"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Developers",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
# No runtime dependencies on purpose: PyGObject comes from the distribution.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/wagnerbugs/parvussh"
Source = "https://github.com/wagnerbugs/parvussh"

[project.scripts]
parvussh = "parvussh.ui.app:main"

[tool.setuptools.packages.find]
include = ["parvussh*"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
    # ruff formats python blocks inside markdown. The aligned comments in
    # SPEC.md are there to be read, not to compile.
    "*.md",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Translation catalogs are long literal tables; line length is not the point.
"parvussh/i18n/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gui: needs GTK typelibs and a display (run under xvfb-run)"]
addopts = "-m 'not gui'"
filterwarnings = [
    # PyGObject's own deprecations, on a distro-provided package we do not
    # control. Ours would still surface: the filters are module-scoped.
    "ignore::DeprecationWarning:gi.*",
    "ignore:.*GLib.unix_signal_add_full is deprecated.*",
]

[tool.coverage.run]
source = ["parvussh/core"]
